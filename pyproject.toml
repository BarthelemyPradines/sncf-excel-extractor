[project]
name = "excel-extractor"
version = "0.1.0"
description = "Excel sheet triage, sub-table detection, media extraction, and CSV export."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
]

[project.scripts]
excel-extractor = "excel_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_extractor"]
